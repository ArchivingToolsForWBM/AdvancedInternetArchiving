
<html>
	<head>
		<style>
			html {
			background-color: rgb(29, 30, 38);
			color: rgb(221, 221, 221);
			font-family: sans-serif;
			}
			
			table, th, td {
			border: 1px solid white;
			border-collapse: collapse;
			}
			
			span.NoLineBreak {
				white-space: nowrap;
			}
			input[type='text'] { font-family: monospace;}
			input[type='number'] { font-family: monospace;}
			
			td label.TableCheckBoxes {   /* thanks to Patrick McElhaney - https://stackoverflow.com/questions/9739259/tick-a-checkbox-in-a-table-cell-by-clicking-anywhere-in-the-table-cell , causes table cells with labels inside them to focus onto whats inside a label */
				display: block;
				text-align: center;
			}
			div.TabbedItems {
				padding-left: 1rem;
			}
			textarea {
				white-space: pre;
			}
			
			div.ScrollableContainer {
				border: 1px solid;
				overflow: auto;
				resize: both;
				width: 500px;
				height: 240px;
			}
			div.OutputPanels {
				padding: 10px;
			}
		</style>
	</head>
<body style="max-width: 1000px; margin: auto; padding: 15px">
<h1 style="text-align: center;">General URL converter</h1>

Paste your URLs here:<br>
<textarea id="InputURLs" cols="60" rows="10" oninput="InputURLsChanged = true;UserAbort = false; ProcessURLs();"></textarea><br>
<hr>
<table>
	<tr>
		<th>Output list</th>
		<th>Output settings</th>
	</tr>
	<tr>
		<td>
			<div class="ScrollableContainer" id="OutputTable"></div><br>
			<span style="font-family: monospace">Number of results: <span id="ResultCount">0</span></span><br>
			<div><button onclick="CopyList()">Copy list</button><span></span></div><br>
			
		</td>
		<td style="text-align: left;">
			<div>
				<div class="OutputPanels">
					Sort: <select id="SortSettings" onchange="ProcessURLs()">
						<option data-sortby="">Creation Order</option>
						<option data-sortby="URL">Alphabetically</option>
						<option data-sortby="URLSmartSort" selected>Alphabetically (Reversed Domain name then TLD, page number padded with zeroes)</option>
						<option data-sortby="Type">Type</option>
						<option data-sortby="KeyName">Keyname</option>
					</select> <label><input type="checkbox" id="ReverseSort" onchange="ProcessURLs()">Reverse</label>
				</div>
				<div class="OutputPanels">
					<div>
						Filter by KeyName: <button onclick="ModifyCheckboxes(1); ProcessURLs()">Check all</button><button onclick="ModifyCheckboxes(0); ProcessURLs()">Uncheck all</button><button onclick="ModifyCheckboxes(2); ProcessURLs()">Invert</button><br>
						<div class="ScrollableContainer" style="width: 400px;" id="KeyNameFilterList">
						
						</div>
					</div>
					<div>
						<label style="font-family: monospace;"><input type="checkbox" checked id="BlankKeyNames" onchange="ProcessURLs();">No Keynames <span id="KeyNameLessCountDisplay"> (0)</span></label>
					</div>
				</div>
				Misc:
				<div class="TabbedItems">
					<div><label><input type="checkbox" checked onchange="InputURLsChanged = true; ProcessURLs();" id="Setting_https">Force <kbd>https</kbd></label></div>
				</div>
			</div>
		</td>
	</tr>
</table>

<script>
	const Saved_ProcessedData = {
		URLList: [],
		URLSet: new Set(),
		OutputText: "",
		KeyNameList: {},
		KeyNameLessCount: 0n
	};
	let UserAbort = false
	let InputURLsChanged = false;
	
	//These are handlers for determining if a github URL is user or not.
		const Github_ReservedNames = new Set([
			"about",
			"apps",
			"codespaces",
			"collections",
			"contact",
			"customer-stories",
			"enterprise",
			"features",
			"git-guides",
			"images",
			"login",
			"mobile",
			"organizations",
			"orgs",
			"premium-support",
			"pricing",
			"readme",
			"search",
			"security",
			"signup",
			"sitemap",
			"solutions",
			"sponsors",
			"team",
			"topics",
			"trending",
			"users"
		]);
		function IsGithubUser(url) {
			let URLObj = new URL(url)
			let UsernamePart = URLObj.pathname.split("/")[1]
			if (Github_ReservedNames.has(UsernamePart)) {
				return false
			}
			return true
		}
	//This is a list of converters. Each URL entered runs though all converters to output variants of a given URL.
	//Notes
	// - "PatternToTest" value can either be a URL pattern object or a string using a pattern syntax (uses JS's
	//   URLPattern object)
	// - "Type" determines what kind of generation it is. "Normal" replaces certain parts of a URL with a known
	//   valid string, and "Pagination" generates each URL based on known max page number.
	// - Pagination notes:
	// -- MinPageNum is the starting page number, to generate each URL from this number, to a known max number.
	//    If unspecified, treats it as if it's 1.
	// -- In a pattern, the capturing group to identify a page number is "<PageNumb>".
	// - Method "CreateVarients" must return an array whose elements are the URL string.
	// - Method "SpecialCondition" must return a boolean value: true to accept the match, or false that it failed
		const URLConverters = [
			{
				PatternToTest: "http{s}?://example.com/pagination/:Username/posts\\?page=:PageNumb(\\d+)",
				Type: "Pagination",
				MinPageNum: 1,
				Regex_PathAndQueryBeforePageNumb: /\/pagination\/(?:[a-zA-Z\d\-]+)\/posts\?page=/,
				Regex_PathAndQueryAfterPageNumb: /$/
			},
			{
				PatternToTest: "http{s}?://example.com/images/:filename\\?format=thumb",
				Type: "Normal",
				CreateVarients(InputURL) {
					let ProcessedURLObject = new URL(InputURL)
					ProcessedURLObject.searchParams.set("format", "thumb")
					let ProcessedURL = ProcessedURLObject.href
					ProcessedURLObject.searchParams.set("format", "original")
					let ProcessedURL2 = ProcessedURLObject.href
					return [ProcessedURL, ProcessedURL2]
				}
			},
			{
				//Repository: https://github.com/Username/RepositoryName
				//Download link (before redirect): https://github.com/Username/RepositoryName/archive/refs/heads/main.zip
				PatternToTest: "http{s}?://github.com/:username/*",
				SpecialCondition(InputURL) {
					return IsGithubUser(InputURL)
				},
				Type: "Normal",
				CreateVarients(InputURL) {
					let GithubURL_UserBio = new URL(InputURL)
					let ConvertOutputs = []
					
					GithubURL_UserBio.search = ""
					let URLPathArr_UserBio = GithubURL_UserBio.pathname.split("/")
					let URLPath_UserBio = URLPathArr_UserBio.slice(0, 2).join("/")
					GithubURL_UserBio.pathname = URLPath_UserBio
					ConvertOutputs.push(GithubURL_UserBio.href)
					
					let GithubURL_Repository = new URL(InputURL)
					GithubURL_Repository.search = ""
					let URLPathArr_Repository = GithubURL_Repository.pathname.split("/")
					if (URLPathArr_Repository.length >= 2) {
						let URLPath_Repository = URLPathArr_Repository.slice(0, 3).join("/")
						GithubURL_Repository.pathname = URLPath_Repository
						ConvertOutputs.push(GithubURL_Repository.href)
						
						let Github_Repository_Download = new URL(InputURL)
						Github_Repository_Download.search = ""
						URLPathArr_Repository_Download = Github_Repository_Download.pathname.split("/")
						let URLPath_Repository_Download = URLPathArr_Repository_Download.slice(0, 3).join("/") + "/archive/refs/heads/main.zip"
						Github_Repository_Download.pathname = URLPath_Repository_Download
						ConvertOutputs.push(Github_Repository_Download.href)
					}
					
					return ConvertOutputs
				}
			}
		]
	//This identifies URLs for giving them keynames for filtering and sorting. If a matching URL is found,
	//the loop terminates with its keyname being set.
	//Notes:
	// - IdentifiedPattern value can either be a pattern object or a URL using the URL pattern syntax (uses JS
	//   URLPattern constructor).
	// - SpecialCondition(url_string) shall return a boolean for special conditions, such as a path that have
	//   a username, but cannot be words of reserved. True means it passes, and false if it shouldn't.
		let URLIdentifiers = [
			{
				IdentifiedPattern: "http{s}?://example.com/images/*\\?format=thumb",
				KeyName: "ExampleImage_Thumb"
			},
			{
				IdentifiedPattern: "http{s}?://example.com/images/*\\?format=original",
				KeyName: "ExampleImage_Orig"
			},
			{
				IdentifiedPattern: "http{s}?://github.com/:Username",
				KeyName: "Github_User"
			},
			{
				IdentifiedPattern: "http{s}?://github.com/:Username/:Repository",
				KeyName: "Github_User_Repository"
			},
			{
				IdentifiedPattern: "http{s}?://github.com/:Username/:Repository/archive/refs/heads/*",
				KeyName: "Github_User_Repository_Download",
				SpecialCondition(url) {
					return IsGithubUser(url)
				}
			},
		]
	//This automatically sets up the counter of how many URLs with a given keyname
		SetupKeyNameCount();
	//Set up the filter key list based on reconized URLs
		GenerateCheckboxKeyFilterList();
	//Test function
		TestURLs();
	
	function TestURLs() {
		document.getElementById("InputURLs").value = `https://example.com/pagination/user1/posts?page=20
https://yournamehere.tumblr.com
https://example.com/pagination/user1/posts?page=4
https://example.com/pagination/user2/posts?page=3
https://example.com/pagination/user2/posts?page=10
https://github.com/ArchivingToolsForWBM/AdvancedInternetArchiving
http://example.com/images/sampleimage.jpg?format=thumb&somethingelse=whatever
http://example.com/images/sampleimage.jpg?format=original
http://example.com/images/sampleimage.jpg?format=thumb
http://example.com/differentpath/foobar.html
https://wikipedia.org
http://yournamehere.tumblr.com
https://yournamehere.tumblr.com
`
	}
	InputURLsChanged = true
	ProcessURLs()
	
	function SetupKeyNameCount() {
		URLIdentifiers.forEach(Identifier => {
			Saved_ProcessedData.KeyNameList[Identifier.KeyName] = 0n
		});
	}
	function GenerateCheckboxKeyFilterList() {
		let FilterList = document.getElementById("KeyNameFilterList")
		let KeyNameListArray = Object.keys(Saved_ProcessedData.KeyNameList)
		KeyNameListArray.sort()
		KeyNameListArray.forEach(KeyName => {
			let Div_CheckboxItem = document.createElement("div")
			Div_CheckboxItem.hidden = true
				//^These are hidden by default, so that the keyname checkbox list only shows
				// revelent URLs and not have a huge list where most keynames aren't used.
			Div_CheckboxItem.style.whiteSpace = "nowrap"
			let Label_CheckboxItem = document.createElement("label")
			Label_CheckboxItem.style.fontFamily = "monospace"
			Div_CheckboxItem.appendChild(Label_CheckboxItem)
			let InputCheckbox_FilterOption = document.createElement("input")
			InputCheckbox_FilterOption.type = "checkbox"
			InputCheckbox_FilterOption.checked = true
			InputCheckbox_FilterOption.id = "KeyNameFilterOption_" + KeyName
			InputCheckbox_FilterOption.addEventListener("change", ProcessURLs.bind())
			Label_CheckboxItem.appendChild(InputCheckbox_FilterOption)
			Label_CheckboxItem.appendChild(document.createTextNode(KeyName))
			let Span_KeyCount = document.createElement("span")
			Span_KeyCount.id = "KeyNameCount_" + KeyName
			Label_CheckboxItem.appendChild(Span_KeyCount)
			
			FilterList.appendChild(Div_CheckboxItem)
		})
	}
	function GenerateOutputURLs({URLLink = "https://www.example.com", URLLinkSmartSort = "https://example.www.com", Type = "Normal"}) {
		this.URL = URLLink
		this.URLSmartSort = URLLinkSmartSort
		this.Type = Type
		this.KeyName = ""
	}
	function AddToOutput(OutputURLObject) {
		let URLString = OutputURLObject.URL
		if (!Saved_ProcessedData.URLSet.has(URLString)) {
			Saved_ProcessedData.URLSet.add(URLString)
			Saved_ProcessedData.URLList.push(OutputURLObject)
		} else {
			//Update previous URL that may have entries missing that the current URL isn't missing.
				let MatchedPrevItem = Saved_ProcessedData.URLList.find(Item => Item.URL == URLString)
				if ((MatchedPrevItem.Type == "Other") && (OutputURLObject.Type != "Other")) {
					MatchedPrevItem.Type = OutputURLObject.Type
				}
		}
	
	}
	function ProcessURLs() {
		let InputURLText = []
		if (InputURLsChanged) {
			//Main process
				//Start things clean
					ClearSaveData()
				//Extract URLs from input text, without any dupes
					InputURLText = document.getElementById("InputURLs").value.match(/ttp(s)?\:\/\/(?!data:)[^\s\"\']+/g) ?? []
					InputURLText = [...new Set(InputURLText)]
				//Convert URL text that lack the "h" in http/https (because console log truncate the middle portion of the href)
					InputURLText = InputURLText.map(URLItem => {
					if (document.getElementById("Setting_https").checked) {
						return "h" + URLItem.replace("ttp://", "ttps://")
					} else {
						return "h" + URLItem
					}
					})
				//Because post-conversion may result in dupes
					InputURLText = [...new Set(InputURLText)] //If URLs went from http to https, that may also results in duplicates.
				//Remove non-genuine URLs.
					InputURLText = InputURLText.filter(Item => {
						try {
							new URL(Item)
							return true
						} catch {
							return false
						}
						
					});
			//Test and convert URLs
				let InputLength = InputURLText.length
				for (let Index1 = 0; Index1 < InputLength; Index1++) {
					let Str_EnteredURL1 = InputURLText[Index1]
					let Obj_EnteredURL1 = new URL(Str_EnteredURL1)
					let HaveMatchedAConverter = false
					URLConverters.forEach(Converter => {
						if (UserAbort) {
							return
						}
						//Here, we need to know if the URL is compatible any converter that matches.
							let DidMatch = CheckIfURLMatchConverter(Converter, Obj_EnteredURL1)
							if (!DidMatch) {
								return
							}
						//If matches, process it
							let GeneratedURLs = [];
							HaveMatchedAConverter = true
							switch (Converter.Type) {
								case "Normal":
								//A simple replacement with a part of the URL
									GeneratedURLs = Converter.CreateVarients(Obj_EnteredURL1.href)
									GeneratedURLs.forEach(Link => {
										AddToOutput(new GenerateOutputURLs({URLLink: Link, URLLinkSmartSort: ReverseURLLabel(Link), Type: Converter.Type}))
									})
									break
								
								case "Pagination":
								//Find another same URL (after our current one) but with the highest page number.
									let MinPageNumber = Converter.MinPageNum ?? 1
									let MaxPageNumber = ObtainPageNumber(Converter.PatternToTest, Str_EnteredURL1)
									
									let Str_EnteredURL1_BeforePageNumb = Str_EnteredURL1.match(Converter.Regex_PathAndQueryBeforePageNumb)[0]
									let StringToProcess1 = new URL(Str_EnteredURL1).pathname + new URL(Str_EnteredURL1).search
									let Str_EnteredURL1_AfterPageNumb = StringToProcess1.replace(Converter.Regex_PathAndQueryBeforePageNumb, "").replace(/\d+/, "")
									
									for (let Index2 = Index1+1; Index2 < InputLength; Index2++) {
										let Str_EnteredURL2 = InputURLText[Index2]
										let Obj_EnteredURL2 = new URL(Str_EnteredURL2)
										//Check if matches the current converter
											let DidMatch2 = CheckIfURLMatchConverter(Converter, Obj_EnteredURL2)
											if (!DidMatch2) {
												continue
											}
										//Check to make sure the URL is the same except for the page number
											let Str_EnteredURL2_BeforePageNumb = Str_EnteredURL2.match(Converter.Regex_PathAndQueryBeforePageNumb)[0]
											let StringToProcess2 = new URL(Str_EnteredURL2).pathname + new URL(Str_EnteredURL2).search
											let Str_EnteredURL2_AfterPageNumb = StringToProcess2.replace(Converter.Regex_PathAndQueryBeforePageNumb, "").replace(/\d+/, "")
											if ((Str_EnteredURL1_BeforePageNumb == Str_EnteredURL2_BeforePageNumb)&&(Str_EnteredURL1_AfterPageNumb == Str_EnteredURL2_AfterPageNumb)) {
												MaxPageNumber = Math.max(MaxPageNumber, ObtainPageNumber(Converter.PatternToTest, Str_EnteredURL2))
											}
									}
								//Generate URLs of each page from MinPageNumber to MaxPageNumber
									let NumberOfPagedURLs = MaxPageNumber-MinPageNumber+1
									if (NumberOfPagedURLs > 10000) {
										if (!confirm("A URL " + Str_EnteredURL1 + " have more than 10000 pages to generate (" + NumberOfPagedURLs.toString(10) + " URLs), do you wish to continue?")) {
											UserAbort = true
											return
										}
									}
									let MaxDigitsOfMaxNumber = MaxPageNumber.toString(10).length
									for (let PageCount = MinPageNumber; PageCount < MaxPageNumber+1; PageCount++) {
										AddToOutput(new GenerateOutputURLs({
											URLLink: Obj_EnteredURL1.protocol + "//" + Obj_EnteredURL1.hostname + Str_EnteredURL1_BeforePageNumb + PageCount.toString(10) + Str_EnteredURL1_AfterPageNumb,
											URLLinkSmartSort: ReverseURLLabel(Obj_EnteredURL1.protocol + "//" + Obj_EnteredURL1.hostname + Str_EnteredURL1_BeforePageNumb + PageCount.toString(10).padStart(MaxDigitsOfMaxNumber, "0") + Str_EnteredURL1_AfterPageNumb),
											Type: Converter.Type
										}))
									}
									
									break
								
								default:
								//If a user enters a converter with an unknown type that matched with a URL
									GeneratedURLs.forEach(Link => {
										AddToOutput(new GenerateOutputURLs({URLLink: Link, Type: Converter.Type}))
									})
							}
					});
					//If a URL not match with any converter, label it as "other"
						if (!HaveMatchedAConverter) {
							let OutputLink = new GenerateOutputURLs({URLLink: Obj_EnteredURL1.href, Type: "Other"})
							AddToOutput(OutputLink)
						}
				}
			//If user abort
				if (UserAbort) {
					ClearSaveData()
				}
			//Identify to add a keyname for each url outputted
				let URLIdentifiersLength = URLIdentifiers.length
				Saved_ProcessedData.URLList.forEach(URLItemToKeyName => {
					let KeyNameMatched = false
					for (let i = 0; i < URLIdentifiersLength; i++) {
						let Identifier = URLIdentifiers[i]
						
						let Pattern = new URLPattern(Identifier.IdentifiedPattern)
						let Condition = true
						if (typeof Identifier.SpecialCondition === "function") {
							Condition = Identifier.SpecialCondition(URLItemToKeyName.URL)
						}
						if (Pattern.test(URLItemToKeyName.URL) && Condition) {
							KeyNameMatched = true
							URLItemToKeyName.KeyName = Identifier.KeyName
							Saved_ProcessedData.KeyNameList[Identifier.KeyName]++
							document.getElementById("KeyNameFilterOption_" + URLItemToKeyName.KeyName).parentNode.parentNode.hidden = false
								//^Make only keynames that are being used based on input visible.
							break
						}
					}
					if (!KeyNameMatched) {
						Saved_ProcessedData.KeyNameLessCount++
					}
				})
			//Display how many occurance of a keyname based on output
				Object.entries(Saved_ProcessedData.KeyNameList).forEach(KeyName => {
					document.getElementById("KeyNameCount_" + KeyName[0]).textContent = " (" + KeyName[1].toString() + ")"
				})
				document.getElementById("KeyNameLessCountDisplay").textContent = " (" + Saved_ProcessedData.KeyNameLessCount.toString(10) + ")"
			//Save the data
				Saved_ProcessedData.URLList
				
			//Make it so that changing the output options not needlessly re-run the same inputs.
				InputURLsChanged = false
		}
		//Process outputs
			let OutputDisplay = Saved_ProcessedData.URLList
			//Filter
				OutputDisplay = OutputDisplay.filter(Item => {
				if (Item.KeyName != "") {
					if (!document.getElementById("KeyNameFilterOption_" + Item.KeyName).checked) {
						return false
					}
				}
				if ((!document.getElementById("BlankKeyNames").checked) && Item.KeyName == "") {
					return false
				}
					return true
				})
			//Sort
				let SortSelects = document.getElementById("SortSettings")
				let SelectedSortIndex = SortSelects.selectedIndex
				let SelectedOption = [...SortSelects.children].find(Ele => Ele.selected)
				let SortSelectedSortProperty = SelectedOption.dataset.sortby
				
				let ReverseSetting = 1
				if (document.getElementById("ReverseSort").checked) {
					ReverseSetting = -1
				}
				
				if (SelectedSortIndex != 0) {
					OutputDisplay.sort((a, b) => {
						if (a[SortSelectedSortProperty] === b[SortSelectedSortProperty]) {
							return 0;
						} else {
							return ((a[SortSelectedSortProperty] < b[SortSelectedSortProperty]) ? -1 : 1) * ReverseSetting;
						}
					});
				}
			//Output format
				document.getElementById("ResultCount").textContent = OutputDisplay.length
				let OutputString = ""
				let OutputDivSpot = document.getElementById("OutputTable")
				ClearChildNodes(OutputDivSpot)
				
				let Ele_OutputTable = document.createElement("table")
				let Ele_OutputTableRow = document.createElement("tr")
				Ele_OutputTable.appendChild(Ele_OutputTableRow)
				
				let Ele_OutputTableHeader_URL = document.createElement("th")
				Ele_OutputTableHeader_URL.appendChild(document.createTextNode("URL"))
				Ele_OutputTableRow.appendChild(Ele_OutputTableHeader_URL)
				
				let Ele_OutputTableHeader_Type = document.createElement("th")
				Ele_OutputTableHeader_Type.appendChild(document.createTextNode("Type"))
				Ele_OutputTableRow.appendChild(Ele_OutputTableHeader_Type)
				
				let Ele_OutputTableHeader_Key = document.createElement("th")
				Ele_OutputTableHeader_Key.appendChild(document.createTextNode("KeyName"))
				Ele_OutputTableRow.appendChild(Ele_OutputTableHeader_Key)
				
				OutputDisplay.forEach((OutputURL,Index, Arr) => {
					OutputString += OutputURL.URL
					if (Index != Arr.length-1) {
						OutputString += "\n"
					}
					
					let Ele_URLItemRow = document.createElement("tr")
					
					let Ele_URLCell = document.createElement("td")
					Ele_URLCell.style.fontFamily = "monospace"
					Ele_URLCell.style.whiteSpace = "pre"
					Ele_URLCell.appendChild(document.createTextNode(OutputURL.URL))
					Ele_URLItemRow.appendChild(Ele_URLCell)
					
					let Ele_TypeCell = document.createElement("td")
					Ele_TypeCell.style.fontFamily = "monospace"
					Ele_TypeCell.style.whiteSpace = "pre"
					Ele_TypeCell.appendChild(document.createTextNode(OutputURL.Type))
					Ele_URLItemRow.appendChild(Ele_TypeCell)
					
					let Ele_KeyCell = document.createElement("td")
					Ele_KeyCell.style.fontFamily = "monospace"
					Ele_KeyCell.style.whiteSpace = "pre"
					Ele_KeyCell.appendChild(document.createTextNode(OutputURL.KeyName))
					Ele_URLItemRow.appendChild(Ele_KeyCell)
					Ele_OutputTable.appendChild(Ele_URLItemRow)
				});
				
				Saved_ProcessedData.OutputText = OutputString
				OutputDivSpot.appendChild(Ele_OutputTable)
	}
	function CheckIfURLMatchConverter(Obj_Converter, Obj_URL) {
		let Pattern = new URLPattern(Obj_Converter.PatternToTest)
		let PatternHaveMatched = Pattern.test(Obj_URL.href)
		let Bool_SpecialConditionPassed = true
		if (typeof Obj_Converter.SpecialCondition === "function") {
			Bool_SpecialConditionPassed = Obj_Converter.SpecialCondition(Obj_URL.href)
		}
		return (PatternHaveMatched && Bool_SpecialConditionPassed)
	}
	function ObtainPageNumber(StrObj_URLPattern, Str_URL) {
		let PageCount = 0
		let PatternMatcher = new URLPattern(StrObj_URLPattern).exec(Str_URL)
		let URLPartNamesToGetPageNumber = [
			"pathname",
			"search",
		]
		for (let i = 0; i < URLPartNamesToGetPageNumber.length; i++) {
			let URLPart = URLPartNamesToGetPageNumber[i]
			try {
				if (PatternMatcher[URLPart].groups.PageNumb === undefined) {
					continue
				}
				PageCount = parseInt(PatternMatcher[URLPart].groups.PageNumb)
				break
			} catch {}
		}
		return PageCount
	}
	function CopyList() {
		setClipboard(Saved_ProcessedData.OutputText)
	}
	function ClearSaveData() {
		Saved_ProcessedData.URLSet.clear();

	//Copy text from textarea
		function DeleteCopyMessage(HTMLElement) {
			HTMLElement.textContent = ""
		}
		
		function setClipboard(String) {
			//Credit goes to Mozilla: https://developer.mozilla.org/en-US/docs/Web/API/Clipboard/write
			const type = "text/plain";
			const blob = new Blob([String], { type });
			const data = [new ClipboardItem({ [type]: blob })];
			
			let EventElement = event.target
			let CopiedMessage = EventElement.parentNode.querySelector("span")
		
			navigator.clipboard.write(data).then(
				((EventElement) => {
				/* success */
					CopiedMessage.textContent = "Copied!"
					CopiedMessage.style.color = "#00FF00"
					setTimeout(DeleteCopyMessage.bind(null, CopiedMessage), 1500)
				}).bind(null, EventElement),
				((EventElement) => {
				/* failure */
					CopiedMessage.textContent = "Failed!"
					CopiedMessage.style.color = "#FF0000"
					setTimeout(DeleteCopyMessage.bind(null, CopiedMessage), 1500)
				}).bind(null, EventElement)
			);
		}
	function ReverseURLLabel(String) {
		let URLObj = {}
		try {
			URLObj = new URL(String)
			let DomainName = URLObj.hostname.split(".")
			let TLD = DomainName.at(-1)
			if (DomainName.length > 1) {
				DomainName.pop()
			}
			DomainName.reverse()
			URLObj.hostname = DomainName.join(".") + "." + TLD
			
			return URLObj.href
		} catch {
			return ""
		}
	}
	function ClearChildNodes(HTMLElement) {
		while (HTMLElement.lastElementChild) {
			HTMLElement.removeChild(HTMLElement.lastElementChild);
		}
	}
	function ModifyCheckboxes(Flag) {
		let ZoneToFindCheckboxes = [...event.target.parentNode.querySelectorAll("input[type=checkbox]")]
		ZoneToFindCheckboxes.forEach(ChkBox => {
			let DivBox = ChkBox.parentNode.parentNode
			if (DivBox.hidden) {
				return
				//^Only affect the checkboxes that are visible.
			}
			if (Flag < 2) {
				ChkBox.checked = Flag
			} else {
				ChkBox.checked = !ChkBox.checked
			}
		});
	}
